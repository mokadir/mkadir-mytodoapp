apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: ns-mytodoapp
  name: todoapp-deployment
  labels:
    app: todoapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todoapp
  template:
    metadata:
      labels:
        app: todoapp
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: init-data-dir
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /app/server/prisma/data && \
              chown -R 1000:1000 /app/server/prisma/data && \
              chmod 755 /app/server/prisma/data
          volumeMounts:
            - name: todoapp-data
              mountPath: /app/server/prisma/data
      containers:
        - name: todoapp-container
          image: mokadir/todoapp:13
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
            - name: DATABASE_URL
              value: "file:./data/dev.db"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: todoapp-secrets
                  key: jwt-secret
            - name: JWT_ACCESS_EXPIRES_IN
              value: "15m"
            - name: JWT_REFRESH_EXPIRES_IN
              value: "7d"
            - name: CORS_ORIGIN
              value: "http://192.168.2.236:30023"
            - name: RATE_LIMIT_WINDOW_MS
              value: "900000"
            - name: RATE_LIMIT_MAX_AUTH
              value: "10"
            - name: RATE_LIMIT_MAX_GENERAL
              value: "100"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: todoapp-data
              mountPath: /app/server/prisma/data
      volumes:
        - name: todoapp-data
          persistentVolumeClaim:
            claimName: todoapp-pvc
